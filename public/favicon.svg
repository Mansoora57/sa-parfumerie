<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background subtle gradient matching the user's silver-grey tone -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c5c5c5" />
      <stop offset="50%" stop-color="#bcbcbc" />
      <stop offset="100%" stop-color="#b4b4b4" />
    </linearGradient>

    <!-- 24K Royal Gold Gradient for Diamond, Monogram, and Brand Title -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2bf72" />
      <stop offset="25%" stop-color="#ca9f4a" />
      <stop offset="50%" stop-color="#fdf0c9" />
      <stop offset="75%" stop-color="#b88d3b" />
      <stop offset="100%" stop-color="#8a631c" />
    </linearGradient>

    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef6dc" />
      <stop offset="35%" stop-color="#dfb65f" />
      <stop offset="70%" stop-color="#b08432" />
      <stop offset="100%" stop-color="#735219" />
    </linearGradient>

    <linearGradient id="facetHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff8e7" />
      <stop offset="50%" stop-color="#f7e1a0" />
      <stop offset="100%" stop-color="#d4aa4d" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 1. Silver-Grey Background Canvas -->
  <rect width="256" height="256" rx="32" fill="url(#bgGrad)" />

  <g id="brand-logo" filter="url(#softShadow)">
    <!-- ======================================================== -->
    <!-- 2. DIAMOND / JEWEL AT THE TOP (Center: x=128, y: 16 to 48) -->
    <!-- ======================================================== -->
    <g id="diamond-top" stroke="#684712" stroke-width="0.75" stroke-linejoin="round">
      <!-- Table Top & Crown -->
      <polygon points="112,18 144,18 156,28 128,48 100,28" fill="url(#goldSheen)" />
      <!-- Facet divisions -->
      <polygon points="112,18 144,18 128,28" fill="#fff5dc" />
      <polygon points="112,18 100,28 128,28" fill="url(#facetHighlight)" />
      <polygon points="144,18 156,28 128,28" fill="#a47c2c" />
      <!-- Lower Pavilion Facets meeting at Culet (128, 48) -->
      <polygon points="100,28 128,48 116,28" fill="url(#goldGradient)" />
      <polygon points="116,28 128,48 128,28" fill="#fdf0c9" />
      <polygon points="128,28 128,48 140,28" fill="#c49b43" />
      <polygon points="140,28 128,48 156,28" fill="#88601c" />
      <line x1="128" y1="18" x2="128" y2="48" stroke="#ffffff" stroke-width="1" stroke-opacity="0.8" />
    </g>

    <!-- Pedestal / Collar under Diamond -->
    <rect x="119" y="49" width="18" height="3" rx="0.5" fill="url(#goldGradient)" stroke="#684712" stroke-width="0.5" />
    <polygon points="122,52 134,52 136,56 120,56" fill="url(#goldSheen)" />
    <rect x="116" y="56" width="24" height="3.5" rx="0.5" fill="url(#goldGradient)" stroke="#684712" stroke-width="0.5" />

    <!-- ======================================================== -->
    <!-- 3. INTERLOCKING "S A" MONOGRAM (Center: x=128, y: 58 to 142) -->
    <!-- ======================================================== -->
    <g id="monogram" fill="url(#goldGradient)" stroke="#5c3f10" stroke-width="0.6">
      <!-- Letter 'A' (Stately architecture) -->
      <!-- Left diagonal leg -->
      <path d="M 128,60 L 123,60 L 102,138 L 112,138 L 117,118 L 139,118 L 144,138 L 154,138 L 133,60 Z M 128,78 L 135,110 L 121,110 Z" />
      <!-- Letter A Serifs at base -->
      <rect x="100" y="136" width="14" height="2.5" rx="0.5" />
      <rect x="142" y="136" width="14" height="2.5" rx="0.5" />

      <!-- Letter 'S' (Interlaced curves flowing around and through A) -->
      <path d="M 148,72 C 144,67 137,64 126,64 C 113,64 103,71 103,83 C 103,96 114,101 126,105 C 139,109 146,114 146,124 C 146,136 134,142 121,142 C 108,142 98,136 96,126 L 107,124 C 108,130 114,134 121,134 C 128,134 134,130 134,123 C 134,115 124,111 112,107 C 100,102 93,95 93,84 C 93,73 103,62 125,62 C 136,62 144,66 148,71 Z" 
            fill="url(#goldSheen)" stroke="#5c3f10" stroke-width="0.8" />
    </g>

    <!-- ======================================================== -->
    <!-- 4. BRAND TITLE: "SHAHZEIN.A" (y: 168)                     -->
    <!-- ======================================================== -->
    <text x="128" y="184" 
          font-family="'Cinzel', 'Trajan Pro', 'Georgia', 'Times New Roman', serif" 
          font-size="25" 
          font-weight="700" 
          letter-spacing="1.5" 
          fill="url(#goldGradient)" 
          stroke="#4a320c" 
          stroke-width="0.5" 
          text-anchor="middle">SHAHZEIN.A</text>

    <!-- ======================================================== -->
    <!-- 5. SUB-TITLE: "= PARFUMERIE =" (y: 206)                   -->
    <!-- ======================================================== -->
    <!-- Left Double Wings/Bars -->
    <line x1="36" y1="202" x2="64" y2="202" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="36" y1="207" x2="64" y2="207" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Center Text -->
    <text x="128" y="209" 
          font-family="'Cinzel', 'Trajan Pro', 'Georgia', 'Times New Roman', serif" 
          font-size="16" 
          font-weight="700" 
          letter-spacing="3" 
          fill="url(#goldGradient)" 
          stroke="#4a320c" 
          stroke-width="0.4" 
          text-anchor="middle">PARFUMERIE</text>

    <!-- Right Double Wings/Bars -->
    <line x1="192" y1="202" x2="220" y2="202" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="192" y1="207" x2="220" y2="207" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round" />

    <!-- ======================================================== -->
    <!-- 6. TAGLINE: "BE REMEMBERED DIFFERENTLY" (y: 232)          -->
    <!-- ======================================================== -->
    <text x="128" y="232" 
          font-family="'Plus Jakarta Sans', 'Helvetica Neue', 'Arial', sans-serif" 
          font-size="10.5" 
          font-weight="700" 
          letter-spacing="1.2" 
          fill="#5a5a5a" 
          text-anchor="middle">BE REMEMBERED DIFFERENTLY</text>
  </g>
</svg>
