<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" fill="none">
  <defs>
    <!-- Multi-Stop Ultra-Luxe 24K Polished Metallic Gold Gradient -->
    <linearGradient id="realGoldBevel" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fff8e7" />
      <stop offset="18%" stop-color="#fae2a3" />
      <stop offset="42%" stop-color="#d4aa4d" />
      <stop offset="68%" stop-color="#b68932" />
      <stop offset="90%" stop-color="#7a5518" />
      <stop offset="100%" stop-color="#4e350b" />
    </linearGradient>

    <!-- Highlight Sheen Gradient -->
    <linearGradient id="goldLightSheen" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fae7b9" />
      <stop offset="100%" stop-color="#c5993b" />
    </linearGradient>

    <!-- Deep Metallic Shadow Gradient -->
    <linearGradient id="goldShadowDepth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a732a" />
      <stop offset="60%" stop-color="#5a3d0f" />
      <stop offset="100%" stop-color="#2a1b05" />
    </linearGradient>

    <!-- Soft Drop Shadow for 3D Realism on Transparent Background -->
    <filter id="luxeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- PURE TRANSPARENT BACKGROUND (No card, no black box) -->

  <g filter="url(#luxeShadow)">
    <!-- ================================================================= -->
    <!-- 3RD IMAGE EMBLEM: THE AUTHENTIC 3D ARCHITECTURAL SA PERFUME FLACON -->
    <!-- Center: X=210                                                    -->
    <!-- ================================================================= -->

    <!-- 1. DIAMOND JEWEL STOPPER (Faceted Hexagonal Gem) -->
    <!-- Top horizontal facet -->
    <polygon points="182,12 238,12 210,26" fill="url(#goldLightSheen)" />
    <!-- Top-left facet -->
    <polygon points="182,12 152,32 210,26" fill="url(#realGoldBevel)" />
    <!-- Top-right facet -->
    <polygon points="238,12 268,32 210,26" fill="url(#goldShadowDepth)" />
    <!-- Bottom-left facet -->
    <polygon points="152,32 210,50 210,26" fill="url(#realGoldBevel)" />
    <!-- Bottom-right facet -->
    <polygon points="268,32 210,50 210,26" fill="url(#goldShadowDepth)" />
    <!-- Stopper Ridge Edges -->
    <polygon
      points="182,12 238,12 268,32 210,50 152,32"
      fill="none"
      stroke="#fffbe8"
      stroke-width="1.2"
      stroke-linejoin="round"
    />

    <!-- 2. NECK & DOUBLE COLLARS -->
    <!-- Upper Collar Bar -->
    <rect x="180" y="52" width="60" height="4.5" rx="1" fill="url(#goldLightSheen)" stroke="#fff" stroke-width="0.4" />
    <!-- Vertical Neck Pillars -->
    <rect x="194" y="56.5" width="7" height="9.5" fill="url(#realGoldBevel)" />
    <rect x="219" y="56.5" width="7" height="9.5" fill="url(#goldShadowDepth)" />
    <!-- Lower Collar Bar -->
    <rect x="172" y="66" width="76" height="5.5" rx="1.2" fill="url(#goldLightSheen)" stroke="#fff" stroke-width="0.4" />

    <!-- 3. FLACON BODY & INTERLOCKING 'SA' MONOGRAM -->

    <!-- Right Shoulder & Right Vertical Wall -->
    <!-- Horizontal shoulder from neck to corner -->
    <path
      d="M 228 69 L 254 69 L 282 95 L 282 222 L 273 222 L 273 99 L 249 77 L 228 77 Z"
      fill="url(#realGoldBevel)"
      stroke="url(#realGoldBevel)"
      stroke-width="0.5"
    />

    <!-- Architectural Letter 'A' (Sharp Apex at Neck, Slanted Legs, Crossbar) -->
    <!-- 'A' Apex & Right Leg -->
    <path
      d="M 210 74 L 220 74 L 282 238 L 268 238 L 210 96 L 196 130 L 187 122 Z"
      fill="url(#realGoldBevel)"
    />
    <!-- 'A' Left Leg (Lower Segment under 'S') -->
    <path
      d="M 174 158 L 138 238 L 152 238 L 184 166 Z"
      fill="url(#realGoldBevel)"
    />
    <!-- 'A' Horizontal Crossbar -->
    <path
      d="M 166 182 L 236 182 L 236 190 L 166 190 Z"
      fill="url(#realGoldBevel)"
    />
    <!-- 'A' Base Bar -->
    <path
      d="M 202 232 L 282 232 L 282 238 L 202 238 Z"
      fill="url(#realGoldBevel)"
    />

    <!-- Flowing Ribbon 'S' Monogram (Interlocking with 'A', forming Left Shoulder) -->
    <!-- The luxury ribbon of 'S' curves gracefully on the left and loops at the base -->
    <path
      d="M 192 74 C 158 74 134 94 134 126 C 134 160 162 178 190 190 C 220 202 226 216 222 230 C 216 248 186 254 156 244 C 142 239 136 228 136 208 L 126 208 C 126 236 138 250 156 256 C 196 268 234 256 242 230 C 248 210 238 192 200 178 C 170 166 148 152 148 126 C 148 104 168 86 192 84 Z"
      fill="url(#realGoldBevel)"
    />

    <!-- Ribbon 'S' Top Highlight Edge -->
    <path
      d="M 190 75 C 160 75 136 95 136 126 C 136 158 164 176 192 188 C 222 200 228 214 224 228"
      fill="none"
      stroke="#ffffff"
      stroke-width="1.8"
      stroke-linecap="round"
      opacity="0.9"
    />

    <!-- Ribbon 'S' Bottom Loop Accent Hook -->
    <path
      d="M 136 208 L 136 192 L 145 192 L 145 208 Z"
      fill="url(#realGoldBevel)"
    />

    <!-- ================================================================= -->
    <!-- TYPOGRAPHY: EXACT SAME CLEAN PROMINENT LUXURY MATTER              -->
    <!-- ================================================================= -->

    <!-- "SHAHZEIN.A" Serif Heading -->
    <text
      x="210"
      y="288"
      text-anchor="middle"
      font-family="'Cinzel', Georgia, serif"
      font-weight="700"
      font-size="34"
      letter-spacing="5"
      fill="url(#realGoldBevel)"
    >SHAHZEIN.A</text>

    <!-- "PARFUMERIE" FLANKED BY 3 BARS ON EACH SIDE -->
    <!-- 3 Bars Left -->
    <rect x="24" y="311" width="68" height="3.5" rx="1" fill="url(#realGoldBevel)" />
    <rect x="24" y="318.5" width="68" height="3.5" rx="1" fill="url(#realGoldBevel)" />
    <rect x="24" y="326" width="68" height="3.5" rx="1" fill="url(#realGoldBevel)" />

    <!-- Text: PARFUMERIE -->
    <text
      x="210"
      y="325"
      text-anchor="middle"
      font-family="'Cinzel', Georgia, serif"
      font-weight="600"
      font-size="18.5"
      letter-spacing="5"
      fill="url(#realGoldBevel)"
    >PARFUMERIE</text>

    <!-- 3 Bars Right -->
    <rect x="328" y="311" width="68" height="3.5" rx="1" fill="url(#realGoldBevel)" />
    <rect x="328" y="318.5" width="68" height="3.5" rx="1" fill="url(#realGoldBevel)" />
    <rect x="328" y="326" width="68" height="3.5" rx="1" fill="url(#realGoldBevel)" />

    <!-- "BE REMEMBERED DIFFERENTLY" FLANKED BY HORIZONTAL BARS -->
    <!-- Left bar -->
    <rect x="24" y="351" width="58" height="2.8" rx="0.8" fill="url(#realGoldBevel)" />

    <!-- Slogan text -->
    <text
      x="210"
      y="355.5"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', system-ui, sans-serif"
      font-weight="600"
      font-size="11.5"
      letter-spacing="3.2"
      fill="#dfd3c0"
    >BE REMEMBERED DIFFERENTLY</text>

    <!-- Right bar -->
    <rect x="338" y="351" width="58" height="2.8" rx="0.8" fill="url(#realGoldBevel)" />
  </g>
</svg>
