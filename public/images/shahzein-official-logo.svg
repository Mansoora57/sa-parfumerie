<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 330" fill="none">
  <defs>
    <!-- 24K Multi-Stop Metallic Gold Gradient with Bevel Sheen -->
    <linearGradient id="goldMatterGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#fff8eb" />
      <stop offset="25%" stop-color="#f5dc99" />
      <stop offset="50%" stop-color="#ffd87d" />
      <stop offset="75%" stop-color="#c59b43" />
      <stop offset="100%" stop-color="#7a5518" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fffdf7" />
      <stop offset="50%" stop-color="#f8e7ba" />
      <stop offset="100%" stop-color="#d4aa4d" />
    </linearGradient>

    <linearGradient id="goldDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b88d3b" />
      <stop offset="70%" stop-color="#6e4d14" />
      <stop offset="100%" stop-color="#3d2a08" />
    </linearGradient>

    <filter id="goldDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ffd87d" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- PURE TRANSPARENT BACKGROUND - NO BACKGROUND FILL -->

  <g filter="url(#goldDropShadow)">
    <!-- ======================================================== -->
    <!-- 1. TOP: GEOMETRIC ARCHITECTURAL SA PERFUME FLACON EMBLEM -->
    <!-- Center: X = 210, Y: 12 to 160                            -->
    <!-- ======================================================== -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <!-- Faceted Diamond Jewel Stopper (Cap) -->
      <polygon
        points="184,14 236,14 262,34 210,64 158,34"
        fill="url(#goldMatterGrad)"
        stroke="#fffdf7"
        stroke-width="1.2"
      />
      <!-- Stopper internal facet reflections -->
      <polygon points="184,14 236,14 210,34" fill="#fffdf7" opacity="0.92" />
      <polygon points="184,14 158,34 210,34" fill="url(#goldLight)" opacity="0.95" />
      <polygon points="236,14 262,34 210,34" fill="url(#goldDeep)" />
      <polygon points="158,34 210,64 210,34" fill="url(#goldLight)" />
      <polygon points="262,34 210,64 210,34" fill="url(#goldDeep)" />
      <line x1="210" y1="14" x2="210" y2="64" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.95" />

      <!-- Neck & Collars -->
      <!-- Upper Collar -->
      <rect x="178" y="66" width="64" height="5.5" rx="1.5" fill="url(#goldLight)" stroke="#fff" stroke-width="0.5" />
      <!-- Vertical Neck Stem -->
      <rect x="189" y="71.5" width="9" height="19" fill="url(#goldLight)" />
      <rect x="222" y="71.5" width="9" height="19" fill="url(#goldDeep)" />
      <!-- Lower Collar (Shoulder Ridge) -->
      <rect x="174" y="90.5" width="72" height="6.5" rx="1.5" fill="url(#goldLight)" stroke="#fff" stroke-width="0.5" />

      <!-- Right Shoulder & Right Vertical Wall -->
      <path
        d="M 230 94 L 249 94 L 271 120 L 271 168"
        fill="none"
        stroke="url(#goldMatterGrad)"
        stroke-width="6.5"
        stroke-linejoin="miter"
        stroke-miterlimit="4"
      />

      <!-- Bottom Horizontal Base Bar -->
      <path
        d="M 198 168 L 271 168"
        fill="none"
        stroke="url(#goldMatterGrad)"
        stroke-width="6.5"
        stroke-linecap="square"
      />

      <!-- Architectural Letter 'A' -->
      <!-- Right leg of A (Slanted pillar to base) -->
      <path
        d="M 210 97 L 268 168"
        fill="none"
        stroke="url(#goldMatterGrad)"
        stroke-width="8.5"
        stroke-linecap="square"
      />
      <!-- Left leg of A (Slanted down to left base) -->
      <path
        d="M 210 97 L 164 163"
        fill="none"
        stroke="url(#goldMatterGrad)"
        stroke-width="7.5"
        stroke-linecap="square"
      />
      <!-- Horizontal crossbar of A -->
      <path
        d="M 181 142 L 243 142"
        fill="none"
        stroke="url(#goldMatterGrad)"
        stroke-width="6.5"
        stroke-linecap="square"
      />

      <!-- Flowing Interlocking Letter 'S' -->
      <!-- Forms rounded left bottle shoulder and loops at base -->
      <path
        d="M 200 97 C 172 93 148 109 148 136 C 148 164 178 168 198 178 C 218 188 222 202 218 214 C 212 228 188 232 168 230 C 150 228 140 216 140 200"
        fill="none"
        stroke="url(#goldMatterGrad)"
        stroke-width="8.5"
        stroke-linecap="round"
        transform="matrix(0.72 0 0 0.72 65 -7)"
      />
      <!-- Beveled Highlight Accent on S -->
      <path
        d="M 197 98 C 174 94 151 110 151 136 C 151 162 180 166 199 176 C 217 186 220 199 216 211"
        fill="none"
        stroke="#ffffff"
        stroke-width="1.8"
        stroke-linecap="round"
        opacity="0.85"
        transform="matrix(0.72 0 0 0.72 65 -7)"
      />
    </g>

    <!-- ======================================================== -->
    <!-- 2. MIDDLE: "SHAHZEIN.A" TYPOGRAPHY                       -->
    <!-- Bold luxury serif lettering (Cinzel style)               -->
    <!-- ======================================================== -->
    <text
      x="210"
      y="222"
      text-anchor="middle"
      font-family="'Cinzel', Georgia, serif"
      font-weight="700"
      font-size="35"
      letter-spacing="5"
      fill="url(#goldMatterGrad)"
    >SHAHZEIN.A</text>

    <!-- ======================================================== -->
    <!-- 3. "PARFUMERIE" FLANKED BY 3 BARS ON LEFT & RIGHT        -->
    <!-- ======================================================== -->
    <!-- 3 Horizontal Bars on Left -->
    <rect x="22" y="244" width="70" height="3.5" rx="1" fill="url(#goldMatterGrad)" />
    <rect x="22" y="252" width="70" height="3.5" rx="1" fill="url(#goldMatterGrad)" />
    <rect x="22" y="260" width="70" height="3.5" rx="1" fill="url(#goldMatterGrad)" />

    <!-- Word: PARFUMERIE -->
    <text
      x="210"
      y="259"
      text-anchor="middle"
      font-family="'Cinzel', Georgia, serif"
      font-weight="600"
      font-size="19"
      letter-spacing="5.5"
      fill="url(#goldMatterGrad)"
    >PARFUMERIE</text>

    <!-- 3 Horizontal Bars on Right -->
    <rect x="328" y="244" width="70" height="3.5" rx="1" fill="url(#goldMatterGrad)" />
    <rect x="328" y="252" width="70" height="3.5" rx="1" fill="url(#goldMatterGrad)" />
    <rect x="328" y="260" width="70" height="3.5" rx="1" fill="url(#goldMatterGrad)" />

    <!-- ======================================================== -->
    <!-- 4. "BE REMEMBERED DIFFERENTLY" FLANKED BY 2 BARS         -->
    <!-- ======================================================== -->
    <!-- Left bar -->
    <rect x="22" y="283" width="60" height="3" rx="0.75" fill="url(#goldMatterGrad)" />

    <!-- Tagline -->
    <text
      x="210"
      y="287.5"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', system-ui, sans-serif"
      font-weight="600"
      font-size="11.5"
      letter-spacing="3.2"
      fill="#d6cab8"
    >BE REMEMBERED DIFFERENTLY</text>

    <!-- Right bar -->
    <rect x="338" y="283" width="60" height="3" rx="0.75" fill="url(#goldMatterGrad)" />
  </g>
</svg>
